---
indexpage:
  title: Documentação do AI Data Engine
  summary: A documentação do AI Data Engine aborda como implantar, conectar fontes
    de dados e usar o AI Data Engine para otimização de armazenamento, investigação
    de metadados, governança de dados e acesso controlado à IA por meio do MCP.
  keywords: ai data engine, aide, storage optimization, investigation, policies, data
    governance, NetApp Console, governed ai access, mcp, model context protocol
  lead: O AI Data Engine é um serviço de inteligência de metadados, gerenciado por
    meio do NetApp Console, que analisa seus sistemas conectados, constrói um catálogo
    de metadados e oferece a visibilidade e as ferramentas para otimizar o armazenamento
    e governar dados em escala. Com acesso de IA governado, os clientes de IA podem
    pesquisar esses metadados por meio do Model Context Protocol (MCP).
